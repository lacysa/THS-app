name: Room Ops Feature Check
on:
  push:
    branches:
      - feat/david-room-ops-2026-10-12
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
